# docker-stack-backup — coverage exemptions (see STATUS.md, "Exemptions")
#
# Copy to coverage-exemptions.conf next to docker-stack-backup.sh (or point
# COVERAGE_EXEMPTIONS_FILE at it). The live file is git-ignored, like config.sh.
#
# An exemption says "this state is not in the archive, and that is deliberate", with a
# reason. Exempted items stay in status.json with their class plus `exempt: <reason>`;
# they just stop counting as uncovered. An entry that matches nothing in a run is
# reported as stale: remove it, or find out what changed.
#
# This file is data. It is never sourced or evaluated: `$(...)` in a reason is text.
# One entry per line:
#
#   <kind>|<subject>|<reason>
#
#   stack|<stack>|<reason>                       every uncovered mount of the stack
#   mount|<stack>:<absolute host path>|<reason>   one bind mount (path as compose resolves it)
#   mount|<stack>:volume:<name>|<reason>          one named volume (its key under `volumes:`)
#   appdata|<dir>|<reason>                       an APPDATA_PATH dir that matches no stack
#
# The reason is required. A line with an unknown kind, an empty field or a control
# character is rejected and logged, the rest still apply, and status.json reports
# exemptions.status = "config-error". A bad file never stops the backup.
#
# Examples:
#
# stack|sandbox-db|disposable scratch databases; restart: "no", recreated on demand
# mount|code-server:/home/me/repos|git working trees; every repo has a remote
# mount|jobsearch:volume:pgdata|dumped nightly by the pg-dump sidecar to /opt/appdata/jobsearch/dumps
# appdata|old-service.pre-migration-20260101|kept until 2026-12-01, then delete
